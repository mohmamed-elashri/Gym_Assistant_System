name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  DJANGO_SETTINGS_MODULE: gym_config.settings
  PYTHONPATH: .

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev tools
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check fitness_api/ gym_config/
      - name: Black
        run: black --check fitness_api/ gym_config/

  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret-0123456789abcdefghijklmnopqrstuvwxyz
      DJANGO_HTTPS: "false"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Django system check
        run: python manage.py check
      - name: Train replacement models (synthetic data, seeded)
        run: python tools/train_synthetic_models.py --seed 42 --rows 5000 --out models
      - name: Run tests
        run: python -m pytest -q -rs

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit tools
        run: python -m pip install bandit pip-audit
      - name: Bandit (medium and higher severity)
        run: bandit -q -r fitness_api gym_config -ll
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create CI environment file
        run: |
          {
            echo "DJANGO_SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')"
            echo "POSTGRES_PASSWORD=$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
            echo "DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1"
          } > .env
      - name: Build image and start the stack (web + PostgreSQL)
        run: docker compose up --build -d
      - name: Wait for readiness (database connected, migrations applied)
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/api/health/ready/; then exit 0; fi
            sleep 3
          done
          docker compose logs
          exit 1
      - name: Check liveness and OpenAPI schema
        run: |
          curl -fsS http://127.0.0.1:8000/api/health/live/
          curl -fsS http://127.0.0.1:8000/api/schema/ | head -n 5
      - name: Confirm migrations are applied in PostgreSQL
        run: docker compose exec -T db psql -U gym -d gym -c "select count(*) from django_migrations;"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
