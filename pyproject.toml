[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = 'py312'
extend-ignore = ['E203']

[tool.isort]
profile = 'black'

[tool.mypy]
python_version = 3.12
ignore_missing_imports = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "gym_config.settings_ci"
