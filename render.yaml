# Render Blueprint for a free demo deployment. See docs/DEPLOY_RENDER.md.
services:
  - type: web
    name: gym-assistant-demo
    runtime: docker
    plan: free
    dockerCommand: sh -c "python manage.py migrate --noinput && gunicorn gym_config.wsgi:application --bind 0.0.0.0:${PORT:-10000} --workers 1 --timeout 120"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: "localhost,.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
